<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
 <title>QSwipe · Staging identity verification</title>
 <link rel="icon" type="image/svg+xml" href="/brand.svg">
 <link rel="stylesheet" href="/staging/staging.css">
 <script type="module" src="/staging/staging.js"></script>
</head>
<body>
 <main class="shell">
  <header><img src="/brand.svg" width="36" height="36" alt=""><strong>QSwipe</strong><mark>STAGING ONLY</mark></header>
  <section class="intro"><h1>Staging identity verification</h1></section>
  <section class="panel" id="setup-panel" aria-live="polite"><h2>Checking staging</h2><p>Available in configured previews only.</p></section>
  <section class="panel hidden" id="login-panel"><h2>Sign in</h2><p>Use an invited <strong>fictional account</strong>. Closing this tab ends the session.</p>
   <form id="otp-request"><label>Email address<input id="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required placeholder="test.user@example.com"></label><button type="submit">Send one-time code</button></form>
   <form id="otp-verify" class="hidden"><label>One-time code<input id="code" autocomplete="one-time-code" inputmode="numeric" minlength="6" maxlength="12" required></label><button type="submit">Verify code</button></form>
   <p class="notice" id="login-status" role="status" aria-live="polite"></p>
  </section>
  <section class="panel hidden" id="workspace-panel"><div class="toolbar"><h2>Workspaces</h2><button type="button" class="secondary" id="logout">Sign out</button></div>
   <label>Workspace<select id="workspace"></select></label><div id="grants" class="grants"></div>
   <button type="button" id="load-roster">Load roster</button><p id="roster-status" role="status" aria-live="polite"></p>
   <div class="scroll"><table><thead><tr><th>Name</th><th>Position</th><th>Unit</th></tr></thead><tbody id="roster"></tbody></table></div>
  </section>
  <footer>Private test project required. Read-only roster. <a href="/">QSwipe demo</a></footer>
 </main>
</body>
</html>
