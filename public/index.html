<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f6f4">
  <meta name="description" content="QSwipe — attendance, commitments, team operations and interactive games.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>QSwipe · Attendance & Team Play</title>
  <link rel="icon" type="image/svg+xml" href="./brand.svg">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand"><img src="./brand.svg" width="46" height="46" alt="QSwipe logo"><span><strong>QSwipe</strong><small>People, present.</small></span></div>
      <div class="workspace-switch"><label for="workspace">WORKSPACE</label><select id="workspace" aria-label="Industry workspace"><option value="bpo">Vertex Contact Center</option><option value="school">Northfield Academy</option><option value="government">City Service Office</option><option value="custom">Creative Studio</option></select></div>
      <nav id="desktop-nav" class="navigation" aria-label="Sections"></nav>
      <div class="sidebar-bottom"><span class="demo-dot"></span> Local demo · no shared records</div>
    </aside>
    <div class="main-column">
      <header class="topbar"><div class="mobile-brand"><img src="./brand.svg" width="32" height="32" alt=""><strong>QSwipe</strong></div><div class="topbar-context"><span class="eyebrow" id="context-label">WORKSPACE OVERVIEW</span><strong id="context-title">Today</strong></div><div class="top-controls"><label class="role-select"><span>Demo role</span><select id="role" aria-label="Preview a demo identity"><option value="member">Member</option><option value="lead" selected>Level 1 · Leader</option><option value="operations">Level 2 · Operations</option><option value="director">Level 3 · Director</option></select></label><button id="profile-shortcut" class="top-avatar" aria-label="Open profile" type="button">JD</button></div></header>
      <main id="main" class="content" tabindex="-1"><noscript>Enable JavaScript to use the interactive QSwipe demo.</noscript></main>
      <footer class="page-footer">QSwipe preview · Sample people and local-only interactions · Not a production attendance system</footer>
    </div>
    <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation"></nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
