name: QSwipe checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check

  team-play-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm install --prefix "$RUNNER_TEMP/qswipe-browser" --no-audit --no-fund playwright@1.56.1
      - name: Test and capture fictional team play
        run: |
          export QSWIPE_BROWSER_PACKAGE="$RUNNER_TEMP/qswipe-browser"
          export QSWIPE_CHROME="$(command -v google-chrome || command -v chromium)"
          node test/browser/team-play.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qswipe-team-play-previews
          path: team-play-previews/*.png
          if-no-files-found: warn
          retention-days: 7
