name: QSwipe checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check

  postgres-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: qswipe_test
          POSTGRES_PASSWORD: disposable-ci-only
        options: >-
          --health-cmd "pg_isready -U postgres -d qswipe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute migration and fictional authorization assertions in disposable PostgreSQL
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$PG_CONTAINER"
          for file in test/postgres/bootstrap.sql supabase/migrations/20261123000000_qswipe_staging_identity_rbac.sql test/postgres/authorization.sql test/postgres/p3_bootstrap.sql supabase/staging/p3_attendance.sql test/postgres/p3_fixture.sql test/postgres/p3_assertions.sql; do
            docker exec -i "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d qswipe_test < "$file"
          done

          bash test/postgres/p3_concurrency.sh

          for file in supabase/staging/p4_approvals.sql test/postgres/p4_fixture.sql test/postgres/p4_assertions.sql; do
            docker exec -i "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d qswipe_test < "$file"
          done
          bash test/postgres/p4_concurrency.sh

          for file in supabase/staging/p5_workspace.sql test/postgres/p5_assertions.sql; do
            docker exec -i "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d qswipe_test < "$file"
          done

          for file in supabase/staging/p6_inbox.sql test/postgres/p6_assertions.sql; do
            docker exec -i "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d qswipe_test < "$file"
          done

  staging-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated pinned browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/qswipe-browser" --no-audit --no-fund playwright@1.56.1
      - name: Run staging browser regression and render fictional previews
        run: |
          set -euo pipefail
          export QSWIPE_BROWSER_PACKAGE="$RUNNER_TEMP/qswipe-browser"
          export QSWIPE_CHROME="$(command -v google-chrome || command -v chromium)"
          node test/browser/p5-browser.mjs
          QSWIPE_P6_BROWSER=1 node test/browser/p5-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qswipe-p6-rendered-previews
          path: p6-previews/*.png
          if-no-files-found: warn
          retention-days: 7
